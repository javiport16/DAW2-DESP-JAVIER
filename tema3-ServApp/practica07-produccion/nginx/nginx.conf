
# El proxy externo termina TLS para este único dominio público.
# Se descartan las cabeceras de protocolo y host recibidas del cliente.
map $host $soundwave_scheme {
    default $scheme;
    javierportela1.piodaw.site https;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 64k;

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $soundwave_backend http://flask:5000;
        proxy_pass $soundwave_backend;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $soundwave_scheme;
        proxy_set_header X-Forwarded-Host "";
    }
}
