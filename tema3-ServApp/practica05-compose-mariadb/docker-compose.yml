
services:
  mariadb:
    image: mariadb:11.4
    container_name: mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword05
      MARIADB_DATABASE: practica05javier
      MARIADB_USER: appuser
      MARIADB_PASSWORD: apppassword
    volumes:
      - datos_mariadb:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/datos.sql:/docker-entrypoint-initdb.d/02-datos.sql:ro
    networks:
      - red-practica05
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  flask:
    build: ./app
    container_name: flask
    restart: unless-stopped
    environment:
      DB_HOST: mariadb
      DB_USER: appuser
      DB_PASSWORD: apppassword
      DB_NAME: practica05javier
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - red-practica05

  nginx:
    image: nginx:alpine
    container_name: nginx-compose
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - flask
    networks:
      - red-practica05

volumes:
  datos_mariadb:

networks:
  red-practica05:
    driver: bridge
